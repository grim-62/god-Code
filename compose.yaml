services:
  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./server
    environment:
      PORT: ${PORT:-5000}
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/god-code}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://app-redis:6379}
      JUDGE0_URL: ${DOCKER_JUDGE0_URL:-http://judge0-server:2358}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:?Run npm run docker:init-env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      app-redis:
        condition: service_healthy
    restart: unless-stopped

  submission-worker:
    build:
      context: ./server
    command: ["npm", "run", "worker"]
    environment:
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/god-code}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://app-redis:6379}
      JUDGE0_URL: ${DOCKER_JUDGE0_URL:-http://judge0-server:2358}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:?Run npm run docker:init-env}
    depends_on:
      mongo:
        condition: service_healthy
      app-redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app-redis:
    image: redis:7-alpine
    volumes:
      - app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge0-config:
    image: node:22-alpine
    command: ["node", "/scripts/write-judge0-config.js"]
    environment:
      JUDGE0_AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN:?Set JUDGE0_AUTHN_TOKEN in .env}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:?Run npm run docker:init-env}
      JUDGE0_POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?Set JUDGE0_POSTGRES_PASSWORD in .env}
      JUDGE0_REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?Set JUDGE0_REDIS_PASSWORD in .env}
    volumes:
      - ./scripts/docker:/scripts:ro
      - judge0-config:/judge0-config
    restart: "no"

  judge0-server:
    image: god-code-judge0:1.13.1
    build:
      context: ./judge0
      target: production
    user: root
    entrypoint: ["/bin/bash", "-lc"]
    command: "ln -sf /judge0-config/judge0.conf /judge0.conf && exec su judge0 -s /bin/bash -c 'exec /api/docker-entrypoint.sh /api/scripts/server'"
    volumes:
      - judge0-config:/judge0-config:ro
    expose:
      - "2358"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - "exit(Net::HTTP.get_response(URI('http://127.0.0.1:2358/about')).is_a?(Net::HTTPSuccess) ? 0 : 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    privileged: true
    depends_on:
      judge0-config:
        condition: service_completed_successfully
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped

  judge0-workers:
    image: god-code-judge0:1.13.1
    build:
      context: ./judge0
      target: production
    user: root
    entrypoint: ["/bin/bash", "-lc"]
    command: "ln -sf /judge0-config/judge0.conf /judge0.conf && exec su judge0 -s /bin/bash -c 'exec /api/docker-entrypoint.sh /api/scripts/workers'"
    volumes:
      - judge0-config:/judge0-config:ro
    privileged: true
    depends_on:
      judge0-config:
        condition: service_completed_successfully
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped

  judge0-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:?Set JUDGE0_POSTGRES_PASSWORD in .env}
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?Set JUDGE0_REDIS_PASSWORD in .env}
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mongo-data:
  app-redis-data:
  judge0-postgres-data:
  judge0-config:
